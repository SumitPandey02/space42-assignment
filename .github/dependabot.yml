version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - playwright
      allure:
        patterns:
          - allure*
      eslint:
        patterns:
          - eslint*
          - "@eslint/*"
          - typescript-eslint
    ignore:
      # TypeScript majors are gated by typescript-eslint's supported range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
